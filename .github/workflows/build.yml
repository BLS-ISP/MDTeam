name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Bundle Tauri Installers
        run: npm run tauri build ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdteam-workspace-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect flat installer binaries
        run: |
          mkdir -p dist-binaries
          find release-assets -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp -v {} dist-binaries/ \;
          ls -lh dist-binaries/

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME || "v1.0.0";
            const ver = tag.replace(/^v/, "");
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const header = `## [${ver}]`;
            const start = md.indexOf(header);
            let body = `Automated release build for MDTeam Workspace ${tag}.`;
            if (start !== -1) {
              const rest = md.slice(start + header.length);
              const firstNl = rest.indexOf("\n");
              const content = firstNl !== -1 ? rest.slice(firstNl + 1) : "";
              const nextSec = content.search(/^## \[/m);
              body = (nextSec !== -1 ? content.slice(0, nextSec) : content).trim();
            }
            body += `\n\n---\n### 🐳 Prebuilt Docker & NethServer 8 Images (GHCR)\n` +
              `- \`ghcr.io/bls-isp/mdteam/workspace-web:${ver}\` (\`:latest\`)\n` +
              `- \`ghcr.io/bls-isp/mdteam/api-server:${ver}\` (\`:latest\`)\n` +
              `- \`ghcr.io/bls-isp/mdteam/yjs-server:${ver}\` (\`:latest\`)\n` +
              `- \`ghcr.io/bls-isp/mdteam-ns8:${ver}\` (\`:latest\`) — NethServer 8 Rootless Module\n`;
            fs.writeFileSync("release_notes.md", body, "utf8");
          '

      - name: Create or Update Public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-binaries/* --clobber
            gh release edit "$TAG" --title "MDTeam Workspace $TAG" --notes-file release_notes.md --draft=false --latest
          else
            gh release create "$TAG" dist-binaries/* --title "MDTeam Workspace $TAG" --notes-file release_notes.md --latest
          fi
